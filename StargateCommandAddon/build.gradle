plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0,8)'
    id 'net.minecraftforge.renamer' version '1.1.8+'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

// Minecraft 1.20.1 runs on Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: minecraft_version

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
        }
        register('client') {}
        register('server') { args '--nogui' }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    // Stargate Journey
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:$minecraft_version-$forge_version")
    // compiled against Stargate Journey; players need it installed
    compileOnly renamer.dependency("maven.modrinth:sgjourney:$sgjourney_version")
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range, sgjourney_version_range: sgjourney_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.property('replaceProperties', replaceProperties)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
    // the Origins, Continuum, Ark of Truth and Infinity gate variants travel inside the mod
    from('../StargateJourneyVariants/pack') {
        include 'assets/**', 'data/**'
    }
}

def licenseName = "LICENSE_${mod_id}"
tasks.named('jar', Jar) {
    from('../LICENSE') { rename { licenseName } }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors
        ])
    }
    archiveClassifier = 'unobfuscated'
}

renamer.mappings.from minecraft.dependency.toSrgFile

// the jar players install (SRG names)
renamer.classes(tasks.named('jar', Jar)) {
    archiveClassifier = ''
}

tasks.named('build') { dependsOn 'renameJar' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
